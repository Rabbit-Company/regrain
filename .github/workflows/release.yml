name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64-v2, os: ubuntu-latest, target: x86_64-unknown-linux-musl, cpu: x86-64-v2 }
          - { name: linux-x86_64-v3, os: ubuntu-latest, target: x86_64-unknown-linux-musl, cpu: x86-64-v3 }
          - { name: linux-x86_64-v4, os: ubuntu-latest, target: x86_64-unknown-linux-musl, cpu: x86-64-v4 }
          - { name: linux-aarch64, os: ubuntu-latest, target: aarch64-unknown-linux-musl, cpu: "" }
          - { name: macos-x86_64, os: macos-latest, target: x86_64-apple-darwin, cpu: "" }
          - { name: macos-aarch64, os: macos-latest, target: aarch64-apple-darwin, cpu: "" }
          - { name: windows-x86_64, os: windows-latest, target: x86_64-pc-windows-msvc, cpu: "" }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install the musl cross toolchain
        if: contains(matrix.target, 'musl')
        run: |
          pip install ziglang
          cargo install --locked cargo-zigbuild
      - name: Build
        shell: bash
        run: |
          if [ -n "${{ matrix.cpu }}" ]; then export RUSTFLAGS="-C target-cpu=${{ matrix.cpu }}"; fi
          if [[ "${{ matrix.target }}" == *musl* ]]; then
            cargo zigbuild --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi
      - name: Package
        shell: bash
        run: |
          binary=regrain
          if [[ "${{ matrix.target }}" == *windows* ]]; then binary=regrain.exe; fi
          archive=regrain-${GITHUB_REF_NAME}-${{ matrix.name }}
          mkdir "$archive"
          cp "target/${{ matrix.target }}/release/$binary" README.md CHANGELOG.md "$archive/"
          if [ -f LICENSE ]; then cp LICENSE "$archive/"; fi
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            7z a "$archive.zip" "$archive" > /dev/null
            echo "ASSET=$archive.zip" >> "$GITHUB_ENV"
          else
            tar -czf "$archive.tar.gz" "$archive"
            echo "ASSET=$archive.tar.gz" >> "$GITHUB_ENV"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ env.ASSET }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Checksums
        run: cd assets && sha256sum * > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: assets/*
